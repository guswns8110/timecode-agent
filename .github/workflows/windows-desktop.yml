name: Windows Desktop Installer

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/windows-desktop.yml"

jobs:
  build-installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        shell: pwsh
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          New-Item -ItemType Directory -Force desktop/tools | Out-Null
          Copy-Item "$env:USERPROFILE\.local\bin\uv.exe" desktop/tools/uv.exe

      - name: Bundle Python 3.12
        shell: pwsh
        run: |
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $PWD "desktop\python"
          uv python install 3.12

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile bootstrap installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "desktop\installer\TimecodeAgent.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TimecodeAgent-Setup-x64
          path: desktop/build/TimecodeAgent-Setup-x64.exe
          if-no-files-found: error
